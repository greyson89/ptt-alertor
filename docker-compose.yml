services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SQLITE_PATH: ${SQLITE_PATH:-/storage/ptt-alertor.db}
      APP_HOST: ${APP_HOST:-http://localhost:9090}
      AUTH_USER: ${AUTH_USER:-admin}
      AUTH_PW: ${AUTH_PW:-changeme}
      BOARD_HIGH: ${BOARD_HIGH:-Gossiping,LoL}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
    ports:
      - "9090:9090"
    volumes:
      - sqlite-data:/storage
    restart: unless-stopped

volumes:
  sqlite-data:
